# GitHub Pages deployment workflow — update `path:` to your site's output directory
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main    # change if your default branch is different (e.g., master)
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (optional)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (if a Node project)
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f yarn.lock ]; then npm ci; else echo "No lockfile found, skipping install"; fi

      - name: Build site
        run: |
          # Adjust these commands to match your site generator (Hugo, Jekyll, Sphinx, etc.)
          if [ -f package.json ]; then npm run build --if-present; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./public    # <<--- CHANGE this to the folder that contains the built site (e.g. ./docs, ./build, ./dist)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
